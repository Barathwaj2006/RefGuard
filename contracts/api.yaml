openapi: 3.0.3
info:
  title: RefGuard API
  version: "1.0"
  description: "STATUS: PROPOSED. RefGuard - The UPI Referral & Scam Shield. API for Universal Scam Scanning and Community Reporting."
servers:
  - url: https://api.refguard.example.com/v1
paths:
  /api/v1/scan:
    post:
      summary: Submit content for scam risk analysis
      operationId: scanContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/scan-request.json'
      responses:
        '200':
          description: Successful scan analysis
          content:
            application/json:
              schema:
                $ref: './schemas/scan-response.json'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './schemas/error-response.json'
  /api/v1/report:
    post:
      summary: Submit a community scam report
      operationId: submitReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/scam-report.json'
      responses:
        '200':
          description: Report successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_id:
                    type: string
                  status:
                    type: string
        '400':
          description: Invalid report
          content:
            application/json:
              schema:
                $ref: './schemas/error-response.json'
