name: RefGuard Full-System CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  integration-and-contracts:
    name: Contracts & Integration E2E Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install && cd backend && npm install

      - name: Run Full-System Integration & Contract Conformance Tests
        run: node integration/tests/runner.js

  android-platform-build:
    name: Android Platform Module Tests & APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android_native/gradlew

      - name: Run Android Unit Tests
        working-directory: ./android_native
        run: ./gradlew test

      - name: Build Android Debug APK
        working-directory: ./android_native
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RefGuard-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
