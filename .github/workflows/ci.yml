name: RefGuard Full-System CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  integration-and-contracts:
    name: Contracts & Integration E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Full-System Integration & Contract Conformance Tests
        run: npm install && npx cap sync android && node integration/tests/runner.js

  android-platform-build:
    name: Android Platform Module Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        working-directory: ./android
        run: cd .. && npm install && npx cap sync android && cd android && chmod +x gradlew && ./gradlew test
