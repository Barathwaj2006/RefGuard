name: RefGuard Full-System CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  integration-and-contracts:
    name: Contracts & Integration E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run Full-System Integration & Contract Conformance Tests
        run: node integration/tests/runner.js

  android-platform-build:
    name: Android Platform Module Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradlew Executable
        run: chmod +x android_native/gradlew

      - name: Run Android Unit Tests
        working-directory: ./android_native
        run: ./gradlew test
