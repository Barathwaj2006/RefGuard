name: RefGuard Hackathon Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-release:
    name: Build and Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android_native/gradlew

      - name: Build Android Release APK
        working-directory: ./android_native
        run: ./gradlew :app:assembleRelease

      - name: Create or Update Hackathon Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hackathon-build
          name: "REFGUARD HACKATHON BUILD"
          body: "Canonical RefGuard Hackathon Release. Automatically updated from main."
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          make_latest: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RefGuard-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
