name: RefGuard Hackathon Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-and-release:
    name: Build and Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build Android Release APK
        run: ./gradlew :app:assembleRelease

      - name: Verify and Hash Release APK
        run: |
          if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "ERROR: app/build/outputs/apk/release/app-release.apk does not exist!"
            exit 1
          fi
          echo "=== RELEASE APK FOUND ==="
          ls -lh app/build/outputs/apk/release/app-release.apk
          echo "=== SHA-256 HASH ==="
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RefGuard-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create or Update Hackathon Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: hackathon-build
          name: "REFGUARD HACKATHON BUILD"
          body: "Canonical RefGuard Hackathon Release APK. Built directly from main/master branch."
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
